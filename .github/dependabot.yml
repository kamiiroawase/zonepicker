# Weekly dependency updates, one grouped PR per ecosystem: gradle covers
# libs.versions.toml and the build scripts, and github-actions covers the workflow
# actions — pinned by commit SHA, so Dependabot updates the SHA together with
# the trailing version comment; release-chain upgrades deserve a diff review
# (see the top of release.yml). The Gradle wrapper is not covered: Dependabot
# has no wrapper ecosystem (gradle-version is a Renovate concept — including it
# fails the whole config parse), bump its distributionUrl by hand
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
