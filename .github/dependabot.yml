# Weekly dependency updates: gradle covers libs.versions.toml and the build
# scripts, github-actions covers actions/checkout, setup-java, …
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
  # The gradle ecosystem above covers libs.versions.toml and build scripts only;
  # gradle-version keeps the wrapper's distributionUrl on new Gradle releases
  - package-ecosystem: gradle-version
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
