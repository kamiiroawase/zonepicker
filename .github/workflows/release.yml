# Triggered on v* tag pushes: publishes the library artifacts to Maven Central (signed,
# Central Portal, auto-released), republishes them to the local Maven repo for the GitHub
# Release attachments (aar plus pom/module/sources files, creating the Release when it
# does not exist), and fails loudly when the README's documented version coordinates were
# not bumped with the tag. The full build gate (compile, tests, format and lint checks)
# runs on the tag itself before anything is published — a tag may point at a commit that
# never went through the Build workflow, and a Central publication cannot be undone.
#
# This workflow holds the Central publishing credentials and the GPG secret key, making
# it a high-value supply-chain target: every action is pinned by commit SHA (a tag can
# be re-pointed on the repo side; the trailing comment records the version), and
# upgrades land only through Dependabot PRs that change the SHA, merged after a human
# reviews the diff.
#
# Required repository secrets (Central Portal: https://central.sonatype.com):
#   ORG_GRADLE_PROJECT_mavenCentralUsername / …Password — a Portal user token
#   ORG_GRADLE_PROJECT_signingInMemoryKey — the ASCII-armored secret key
#     (gpg --export-secret-keys --armor …)
#   ORG_GRADLE_PROJECT_signingInMemoryKeyId — the key id
#   ORG_GRADLE_PROJECT_signingInMemoryKeyPassword — that key's passphrase
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  # Tag re-pushes queue behind the running release instead of cancelling it:
  # a Central upload interrupted mid-flight leaves a half-published deployment
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full clone: the version derives from the exact v* tag at HEAD; a shallow
          # clone misses the tags
          fetch-depth: 0

      # The READMEs document the released coordinates in the dependency snippet; a
      # forgotten bump ships stale versions to every reader until someone notices. Fail
      # the release instead: the snippet must reference the tag's version and must have
      # dropped the previous tag's. The match is token-anchored — a plain fixed-string
      # grep would hit substrings (1.2.1 inside 1.2.11); the logic lives in the shared
      # check-docs-version action, parameterized here with the snippet's coordinate
      # prefix and the reverse (previous-version-gone) check
      - name: Check README version coordinates match the tag
        uses: ./.github/actions/check-docs-version
        with:
          docs: README.md README.en.md
          coordinate-prefix: "zonepicker:"
          reverse: true

      # Publishing-credentials gate before the long build, same spirit as the README
      # coordinates gate above: a missing configuration fails loudly and early. A missing
      # Portal token would otherwise surface as a 401 only at the upload stage; a missing
      # key is the sneakiest — the signingKey guard in build.gradle.kts treats an empty
      # value as unconfigured and silently skips signing, and the unsigned artifacts get
      # rejected by Central only after the upload, late and pointing nowhere near the
      # root cause. Only non-emptiness is asserted, no value is echoed; the key id and
      # the key passphrase are outside the gate — an empty passphrase is a legal
      # configuration for a passphrase-less key
      - name: Check publishing secrets are configured
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralUsername }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralPassword }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKey }}
        run: |
          for secret in \
            ORG_GRADLE_PROJECT_mavenCentralUsername \
            ORG_GRADLE_PROJECT_mavenCentralPassword \
            ORG_GRADLE_PROJECT_signingInMemoryKey; do
            test -n "${!secret}" || {
              echo "$secret is missing or empty — configure it in the repository's Actions secrets; publishing cannot proceed"
              exit 1
            }
          done

      # Same gate the Build workflow runs: this workflow executes gradlew too, and it
      # publishes — a tampered wrapper must fail before anything reaches Central
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            gradle/libs.versions.toml
            gradle/wrapper/gradle-wrapper.properties
            **/*.gradle.kts

      # Same gate the Build workflow runs on main: the tag may point at a commit that
      # never went through CI (pushed from a feature branch, say), and publishing to
      # Central is irreversible — verify before anything is published
      - name: Build and test
        run: ./gradlew build

      - name: Publish to local Maven
        run: ./gradlew :zonepicker:publishToMavenLocal

      # The tag checkout sits exactly on the v* tag, so the exact-match derivation must
      # produce precisely the tag version — a SNAPSHOT here would publish the release
      # assets under wrong coordinates and break every documented lookup
      - name: Verify published version equals the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test -d "$HOME/.m2/repository/io/github/kamiiroawase/zonepicker/$VERSION" || {
            echo "expected published version $VERSION (exact-match tag derivation), found instead:"
            ls "$HOME/.m2/repository/io/github/kamiiroawase/zonepicker"
            exit 1
          }

      # The real distribution: signed artifacts uploaded to the Central Portal and
      # released automatically. --no-configuration-cache keeps the publish task out of
      # any third-party config-cache edge cases; the release must not fail on those
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralUsername }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralPassword }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyId }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyPassword }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKey }}
        run: ./gradlew :zonepicker:publishToMavenCentral --no-configuration-cache

      - name: Collect release assets
        run: |
          M2="$HOME/.m2/repository/io/github/kamiiroawase/zonepicker"
          STAGE="release-assets"
          mkdir -p "$STAGE"
          find "$M2" -type f ! -name 'maven-metadata-local.xml' -exec cp {} "$STAGE/" \;
          echo "Collected $(find "$STAGE" -type f | wc -l) files"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release-assets/*
          generate_release_notes: true
