name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  # Manual trigger: re-run the whole pipeline without an empty commit
  # (release-artifact verification etc.)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# All actions are pinned by commit SHA (a tag can be re-pointed on the repo side;
# the trailing comment records the version). Upgrades land through Dependabot PRs
# that update the SHA, merged after a human reviews the diff
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full clone: the publication version derives from the exact v* tag at HEAD via
          # git describe; a shallow clone misses the tags.
          fetch-depth: 0

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            gradle/libs.versions.toml
            gradle/wrapper/gradle-wrapper.properties
            **/*.gradle.kts

      - name: Build, test and lint (includes spotlessCheck)
        run: ./gradlew build

      # The Maven Central publish itself runs only in the Release workflow (tag push, with
      # credentials); here the publishing pipeline gets its only CI coverage: after
      # publishing to the local Maven repo, assert the artifacts land under a single
      # version directory and the pom carries the heavyweight transitive dependencies. The
      # exact-tag version derivation is end-to-end guarded in the Release workflow (which
      # checks the tag out); here the version is whatever the current HEAD derives —
      # 0.0.0-SNAPSHOT on a plain main push (HEAD sits past the tag, by design: the
      # released number never sticks to unreleased commits), the tag version only when
      # main HEAD is itself tagged
      - name: Verify Maven publishing
        run: |
          ./gradlew :zonepicker:publishToMavenLocal
          ROOT="$HOME/.m2/repository/io/github/kamiiroawase/zonepicker"
          test "$(find "$ROOT" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1
          VERSION=$(find "$ROOT" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | head -n 1)
          test -n "$VERSION"
          ARTIFACTS="$ROOT/$VERSION"
          test -f "$ARTIFACTS/zonepicker-$VERSION.aar"
          test -f "$ARTIFACTS/zonepicker-$VERSION-sources.jar"
          test -f "$ARTIFACTS/zonepicker-$VERSION.pom"
          test -f "$ARTIFACTS/zonepicker-$VERSION.module"
          grep -q com.google.android.material "$ARTIFACTS/zonepicker-$VERSION.pom"
          grep -q androidx.appcompat "$ARTIFACTS/zonepicker-$VERSION.pom"
          echo "Published artifacts verified: $VERSION"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            zonepicker/build/reports/tests/**
            zonepicker/build/test-results/**
            app/build/reports/tests/**
          if-no-files-found: ignore
